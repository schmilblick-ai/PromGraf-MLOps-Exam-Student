apiVersion: 1
groups:
    - orgId: 1
      name: bike-api-support-L2
      folder: MLOps Alerts
      interval: 1m
      rules:
        - uid: afobyja1xvxfkd
          title: ApiPredictLatencyHigh
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheusuid00
              model:
                editorMode: code
                expr: bike_request_duration_seconds_sum{endpoint="/predict"}/bike_request_duration_seconds_count{endpoint="/predict"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.08
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          keepFiringFor: 1m
          annotations:
            summary: |-
                Hello,

                latency for bike-api is unusually high, plese check
          labels:
            service: bike-api
            severity: critical
            team: mlops
          isPaused: false
          notification_settings:
            receiver: empty
        - uid: afoelpxwinv9ce
          title: RMSE too high
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheusuid00
              model:
                editorMode: code
                expr: bike_model_rmse > 30
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: lio

